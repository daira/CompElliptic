name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (lake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Installs the toolchain from `lean-toolchain`, fetches the Mathlib cache,
      # and runs `lake build` — which also runs the in-file `native_decide` sanity checks.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0

  # Re-checks the library with nanoda, an independent reimplementation of the Lean
  # kernel (see scripts/check_nanoda.sh). A separate job so `build` reports quickly and
  # can gate PR acceptance on its own; this one starts only after a green build, and its
  # `lake build` restores the build cache that job just saved, so it verifies rather
  # than rebuilds.
  nanoda:
    name: an independent kernel accepts the build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
      - name: Build lean4export at the pinned toolchain's tag
        run: |
          TOOLCHAIN=$(cat lean-toolchain)
          git clone --depth 1 --branch "${TOOLCHAIN##*:}" \
            https://github.com/leanprover/lean4export work/lean4export
          cd work/lean4export && lake build
      - name: Build nanoda at the pinned revision
        run: |
          git clone --depth 1 \
            --revision=418320295890faed83a96fd97907b12a3b6728c2 \
            https://github.com/ammkrn/nanoda_lib work/nanoda_lib
          cargo build --release --manifest-path work/nanoda_lib/Cargo.toml
      - name: Export the library and re-check it
        run: |
          scripts/check_nanoda.sh work/lean4export/.lake/build/bin/lean4export \
            work/nanoda_lib/target/release/nanoda_bin

  generators:
    name: Field-file generators reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install PARI/GP
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pari-gp
      # System python3 (preinstalled on ubuntu-latest) suffices; the generators are stdlib-only
      # and shell out to `gp` for the factorizations.
      - name: Regenerate the field files
        run: |
          python3 scripts/gen_pasta.py > CompElliptic/Fields/Pasta.lean
          python3 scripts/gen_jubjub.py > CompElliptic/Fields/Jubjub.lean
      - name: Fail if the regenerated files differ from the committed ones
        run: git diff --exit-code CompElliptic/Fields/Pasta.lean CompElliptic/Fields/Jubjub.lean

  velu-certificates:
    name: Vélu certificates reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Sage pinned to the version that generated the committed certificates:
      # Singular's `lift` output (the emitted cofactors) can differ between
      # versions, so byte-reproducibility needs the same engine as the local
      # regeneration.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: sage
          condarc: |
            channels:
              - conda-forge
          create-args: sage=10.9
          cache-environment: true
      - name: Regenerate the certificate section
        shell: bash -el {0}
        run: sage scripts/gen_velu_certificates.sage
      - name: Fail if the regenerated section differs from the committed one
        run: git diff --exit-code CompElliptic/Isogenies/VeluCertificates.lean

  native-lane:
    name: FastFieldNative lane is core-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check the precompiled lane's import closure
        run: scripts/check_native_lane.sh

  csimp-census:
    name: csimp lemmas are axiom-censused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check every @[csimp] declaration has an assert_axioms entry
        run: scripts/check_csimp_census.sh

  native-optin:
    name: native-executing checks are opt-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check no ambient evaluation-based checks in the lane import cone
        run: python3 scripts/check_native_optin.py
